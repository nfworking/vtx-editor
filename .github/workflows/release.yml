name: Release

# Builds the Vantrex IDE for Windows, macOS and Linux.
#
# - Push a tag such as v0.1.0 to build everything and publish a GitHub Release with the archives and checksums.
# - Run it by hand (Actions > Release > Run workflow) to build and download the archives from the run page. Pick a single platform
#   to get a result faster; tick "Publish a draft release" to also attach the archives to a draft release.
#
# The native parts of the editor (terminal, keymap, file watching) are compiled on each platform's own runner, so a build for one
# platform cannot be made from another.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [all, windows, macos]
        default: all
      draft_release:
        description: Publish a draft release with the archives
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SELECTED: ${{ inputs.platforms }}
        run: |
          ALL='[
            {"name":"Windows x64","os":"windows-2022","platform":"win32","arch":"x64","group":"windows"},
            {"name":"macOS arm64 (Apple silicon)","os":"macos-15","platform":"darwin","arch":"arm64","group":"macos"}
          ]'
          if [ -z "$SELECTED" ] || [ "$SELECTED" = all ]; then
            MATRIX="$(echo "$ALL" | jq -c '.')"
          else
            MATRIX="$(echo "$ALL" | jq -c --arg g "$SELECTED" '[.[] | select(.group == $g)]')"
          fi
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$MATRIX" | jq -r 'map(.name) | join(", ")')"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Downloads that do not change between runs: the Electron binaries, the headers node-gyp compiles native modules against, and
      # the built-in extensions fetched from GitHub. Restoring them is faster than downloading them again every time.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/node-gyp
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/node-gyp/Cache
            .build/builtInExtensions
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'product.json') }}
          restore-keys: |
            downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      # The Windows packaging step checks and strips existing signatures on bundled binaries with signtool.exe, which ships with
      # the Windows SDK on the runner but is not on PATH.
      - name: Put signtool on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
          if (-not $tool) { throw 'signtool.exe was not found in the Windows SDK on this runner' }
          Add-Content -Path $env:GITHUB_PATH -Value $tool.DirectoryName
          Write-Host "signtool: $($tool.FullName)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The editor compares this with the latest release to know when an update is available.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.vantrexVersion=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')"

      - name: Build
        run: pnpm run gulp vscode-${{ matrix.platform }}-${{ matrix.arch }}-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The setup program for Windows: a per-user installer (no administrator prompt) built with Inno Setup from the build above.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm run gulp vscode-win32-${{ matrix.arch }}-inno-updater
          pnpm run gulp vscode-win32-${{ matrix.arch }}-user-setup
          ls -l ".build/win32-${{ matrix.arch }}/user-setup"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          OUT="$(cd .. && pwd)/VSCode-${{ matrix.platform }}-${{ matrix.arch }}"
          NAME="Vantrex-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist
          test -d "$OUT" || { echo "build output not found: $OUT"; exit 1; }
          # Source maps (about 300 MB) and the unused AI runtime are not needed to run the editor.
          find "$OUT" -type d -path "*/node_modules.asar.unpacked/@microsoft/copilot-sdk-*" -prune -exec rm -rf {} +
          find "$OUT" -type f -name "*.js.map" -path "*/app/out/*" -delete
          case "${{ matrix.platform }}" in
            win32)
              test -f "$OUT/Vantrex.exe" || { echo "Vantrex.exe is missing from the build"; ls "$OUT"; exit 1; }
              # 7-Zip is a Windows program: give it Windows paths, not the /d/a/... paths of Git Bash.
              ZIP="$(cygpath -w "$PWD/dist/${NAME}.zip")"
              (cd "$OUT" && 7z a -tzip -mx=5 "$ZIP" .)
              SETUP=".build/win32-${{ matrix.arch }}/user-setup/VantrexSetup.exe"
              test -f "$SETUP" || { echo "the installer was not built: $SETUP"; ls ".build/win32-${{ matrix.arch }}/user-setup" || true; exit 1; }
              cp "$SETUP" "dist/${NAME}-setup.exe"
              ;;
            darwin)
              APP="$OUT/Vantrex.app"
              test -d "$APP" || { echo "Vantrex.app is missing from the build"; ls "$OUT"; exit 1; }
              # Not notarised: an ad-hoc signature is the least macOS accepts to run the app on Apple silicon.
              codesign --force --deep --sign - "$APP"
              ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${NAME}.zip"
              # A disk image with the app and a shortcut to Applications, for dragging in. The zip stays: the editor updates itself from it.
              DMG_DIR="$(mktemp -d)"
              ditto "$APP" "$DMG_DIR/Vantrex.app"
              ln -s /Applications "$DMG_DIR/Applications"
              hdiutil create -volname "Vantrex" -srcfolder "$DMG_DIR" -ov -format UDZO "dist/${NAME}.dmg"
              rm -rf "$DMG_DIR"
              ;;
            linux)
              test -x "$OUT/vantrex" || { echo "the vantrex launcher is missing from the build"; ls "$OUT"; exit 1; }
              tar -C "$(dirname "$OUT")" -czf "dist/${NAME}.tar.gz" "$(basename "$OUT")"
              ;;
          esac
          ls -lh dist
          # An archive with nothing in it must fail the build, not upload.
          for f in dist/*; do test "$(wc -c < "$f")" -gt 10000000 || { echo "$f is suspiciously small"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: vantrex-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The text of the release: the notes file for the tag (release-notes/<tag>.md), or a plain list of commits when there is none.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            head -n 1 "release-notes/${GITHUB_REF_NAME}.md" | grep -q '^# ' || { echo "release-notes/${GITHUB_REF_NAME}.md must start with a '# ' heading"; exit 1; }
            cp "release-notes/${GITHUB_REF_NAME}.md" out/release-notes.md
            echo "using release-notes/${GITHUB_REF_NAME}.md"
          else
            echo "::warning::No release-notes/${GITHUB_REF_NAME}.md: the release text is a list of commits. Write the notes with scripts/draft-release-notes.sh before tagging."
            PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)"
            {
              echo "# Vantrex ${GITHUB_REF_NAME#v}"
              echo
              echo "## Changes"
              echo
              git log --no-merges --pretty='- %s' "${PREV:+$PREV..}${GITHUB_SHA}"
            } > out/release-notes.md
          fi
          cat out/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: out/release-notes.md
          retention-days: 14

  release:
    name: Publish release
    needs: [build, notes]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vantrex-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$REPO" --title "Vantrex IDE ${GITHUB_REF_NAME}" --notes-file notes/release-notes.md
          else
            gh release create "draft-${GITHUB_RUN_NUMBER}" artifacts/* --repo "$REPO" --title "Vantrex IDE (draft ${GITHUB_RUN_NUMBER})" \
              --target "$GITHUB_SHA" --draft --notes-file notes/release-notes.md
          fi
